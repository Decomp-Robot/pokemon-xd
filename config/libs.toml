# Default libraries (common to all GC/Wii games)
# These are loaded first, then version-specific config/GAMEID/libs.toml adds to them

[[lib]]
name = "Runtime.PPCEABI.H"
mw_version = "GC/1.3.2"
cflags_preset = "runtime"
progress_category = "sdk"

[[lib.object]]
name = "Runtime.PPCEABI.H/global_destructor_chain.c"
completed = true

[[lib.object]]
name = "Runtime.PPCEABI.H/__init_cpp_exceptions.cpp"
completed = false

[[lib.object]]
name = "Runtime.PPCEABI.H/MemFuncs.c"
completed = true
cflags = [
    "-nodefaults",
    "-proc gekko",
    "-align powerpc",
    "-enum int",
    "-fp hardware",
    "-Cpp_exceptions off",
    "-O4,p",
    "-inline auto",
    "-pragma \"cats off\"",
    "-pragma \"warn_notinlined off\"",
    "-maxerrors 1",
    "-nosyspath",
    "-RTTI off",
    "-fp_contract on",
    "-str reuse",
    "-multibyte",
    "-use_lmw_stmw on",
    "-str reuse,pool,readonly",
    "-gccinc",
    "-common off",
    "-i src/ext/dolphin_sdk/include/libc",
    "-lang=c",
]
