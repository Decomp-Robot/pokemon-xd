[[lib]]
name = "main"
mw_version = "GC/2.6"
cflags_preset = "game"
progress_category = "game"
# The game code is full of stmw/lmw register saves (only the third-party
# sound library uses _savegpr_/_restgpr_ helpers), so the original game
# library was built with the paired register saves enabled.
cflags_extra = ["-use_lmw_stmw on"]

