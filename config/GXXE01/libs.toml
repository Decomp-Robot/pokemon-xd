# unoptimized: -O0,p keeps the spilled temporaries and dead stores the objects
# still contain. All three share the settings below, and each of them is
# required - -O4,p shrinks OSAlloc.o .text from 0x11CC to 0xFE8, the peephole
# pass off grows it to 0x1214, -inline auto or -schedule off shrinks it to
# 0x11C4, and without -use_lmw_stmw (0x1204) or without the readonly string pool
