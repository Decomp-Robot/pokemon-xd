# The MSL runtime modules come from the two archives the original map
# identifies, and each object keeps its original module identity:
# Gecko_ExceptionPPC, GCN_mem_alloc, abort_exit, alloc, ansi_files,
# ansi_fp, arith, buffer_io, critical_regions, ctype, direct_io, file_io,
# FILE_POS and mbstring.
[[lib]]
name = "Runtime.PPCEABI.H.a"
mw_version = "GC/2.6"
cflags_preset = "runtime"
progress_category = "sdk"
cflags_extra = ["-i src/ext/dolphin_sdk/include", "-i src/ext/dolphin_sdk/include/libc", "-D__GEKKO__"]

# Exception fragment registration (Gecko_ExceptionPPC.o) and the default
# heap allocator (GCN_mem_alloc.o) belong to the OS runtime archive.
