# MSL runtime modules use the runtime preset's automatic inlining.
# The stream operations keep their three original objects: direct_io
# (fwrite/__fwrite), file_io (fclose inlines fflush) and FILE_POS
# (fseek/_fseek/ftell); calls to buffer and critical-region routines
# remain cross-object calls.
#
# Objects whose data the library's own code uses own those ranges: ansi_fp
# holds the pow_10 table, the __two_exp switch jump table, the decimal
# string pool (rodata) and the integer-to-double conversion constants
# (sdata2); Gecko_ExceptionPPC holds the fragment table (.bss).
